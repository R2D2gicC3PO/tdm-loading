<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #07051A;
  --a1:   #7340E8;
  --a2:   #A78BF5;
  --text: #E8E8F8;
  --dim:  rgba(232,232,248,.30);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
}

/* CRT scanlines */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.04) 2px, rgba(0,0,0,.04) 4px);
}
/* vignette */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 99; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.72) 100%);
}

#canvas-bg { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* ── Keyframes ────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse   { 0%,100%{opacity:.35;} 50%{opacity:1;} }
@keyframes glitch {
  0%,88%,100% { transform: none; }
  89%  { transform: skewX(-5deg) translateX(-4px); }
  91%  { transform: skewX(4deg)  translateX(4px); }
  93%  { transform: none; }
  95%  { transform: translateX(-2px); }
  97%  { transform: none; }
}
@keyframes progGlow {
  0%,100% { box-shadow: 0 0 8px rgba(115,64,232,.5); }
  50%     { box-shadow: 0 0 20px rgba(167,139,245,.9); }
}
@keyframes logoGlow {
  0%,100% { box-shadow: 0 0 20px rgba(115,64,232,.25); }
  50%     { box-shadow: 0 0 40px rgba(167,139,245,.45); }
}

/* ── App layout ───────────────────────────────── */
#app {
  position: relative; z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 36px 5vw 28px;
  gap: 0;
}

/* ── Hero ─────────────────────────────────────── */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 36px;
  opacity: 0;
  animation: fadeUp .55s .05s cubic-bezier(.22,1,.36,1) both;
}

.logo-wrap {
  width: 72px; height: 72px;
  border-radius: 14px;
  background: rgba(115,64,232,.1);
  border: 1px solid rgba(115,64,232,.35);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  margin-bottom: 18px;
  animation: logoGlow 3s ease-in-out infinite;
}
.logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
#logo-fallback {
  font-family: 'Rajdhani', sans-serif; font-weight: 700;
  font-size: 18px; color: var(--a2); letter-spacing: 1px; display: none;
}

.server-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(42px, 6vw, 72px);
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  line-height: 1;
  background: linear-gradient(105deg, #fff 0%, var(--a2) 45%, var(--a1) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 18px rgba(115,64,232,.4));
  animation: glitch 7s 3s ease-in-out infinite;
  margin-bottom: 10px;
}

.server-tag {
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--dim);
}

.hero-meta {
  display: flex; align-items: center; gap: 16px;
  margin-top: 10px;
}
.status-line {
  font-size: 9px; letter-spacing: 2px; color: var(--a2); opacity: .55;
}
.pill {
  font-size: 9px; padding: 3px 10px;
  border: 1px solid rgba(115,64,232,.22);
  color: var(--dim); display: none; align-items: center; gap: 5px;
}
.pill.show { display: flex; }
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--a2); box-shadow: 0 0 5px var(--a2);
  animation: pulse 2.2s ease-in-out infinite;
}

/* ── Progress ─────────────────────────────────── */
.prog-block {
  width: 100%; max-width: 500px;
  margin-bottom: 44px;
  opacity: 0;
  animation: fadeIn .5s .4s ease both;
}
.prog-row {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.prog-label {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim);
}
.prog-pct { font-size: 13px; color: var(--a2); }

.prog-track {
  width: 100%; height: 3px; border-radius: 99px;
  background: rgba(115,64,232,.12);
  overflow: visible;
  margin-bottom: 10px;
  position: relative;
}
.prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--a1), var(--a2));
  border-radius: 99px;
  transition: width .4s cubic-bezier(.22,1,.36,1);
  animation: progGlow 2.4s ease-in-out infinite;
  position: relative;
}
.prog-fill::after {
  content: '';
  position: absolute; right: -1px; top: 50%;
  transform: translateY(-50%);
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--a2);
  box-shadow: 0 0 10px var(--a2), 0 0 20px rgba(167,139,245,.5);
}

.prog-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.prog-status {
  font-size: 9.5px; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}

.discord-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px;
  border: 1px solid rgba(88,101,242,.25);
  color: rgba(232,232,248,.5); text-decoration: none; cursor: pointer;
  font-family: 'Share Tech Mono', monospace; font-size: 10px;
  transition: border-color .2s, color .2s, box-shadow .2s;
  flex-shrink: 0;
}
.discord-btn:hover {
  border-color: rgba(88,101,242,.5);
  color: #fff;
  box-shadow: 0 0 12px rgba(88,101,242,.2);
}
.d-icon { width: 12px; height: 12px; flex-shrink: 0; }

/* ── Leaderboard ──────────────────────────────── */
.lb-wrap {
  width: 100%; max-width: 960px;
  opacity: 0;
  animation: fadeIn .5s .7s ease both;
}

.lb-sep {
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(115,64,232,.25) 20%, rgba(115,64,232,.25) 80%, transparent);
  margin-bottom: 20px;
}

.lb-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}

.lb-col {
  padding: 0 20px;
  border-left: 1px solid rgba(115,64,232,.1);
  opacity: 0; transform: translateY(10px);
  transition: opacity .35s ease, transform .35s ease;
}
.lb-col:first-child { border-left: none; padding-left: 0; }
.lb-col.show { opacity: 1; transform: translateY(0); }

.lb-head {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--a2); opacity: .4;
  margin-bottom: 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid rgba(115,64,232,.12);
}

.lb-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; line-height: 1; padding: 4px 0;
}

.lb-rank {
  width: 16px; flex-shrink: 0;
  font-size: 9px; color: var(--dim); text-align: center;
}
.lb-rank.r1 { color: var(--a2); }

/* avatar circle */
.lb-avatar {
  width: 22px; height: 22px; flex-shrink: 0;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(115,64,232,.25);
  position: relative;
  background: rgba(115,64,232,.12);
  display: flex; align-items: center; justify-content: center;
}
.lb-avatar img {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}
.lb-avatar-init {
  font-size: 9px; font-weight: 700;
  color: var(--a2); line-height: 1;
  font-family: 'Rajdhani', sans-serif;
  display: none;
}

.lb-name {
  flex: 1; color: rgba(232,232,248,.6);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 10px;
}
.lb-val { color: var(--a2); flex-shrink: 0; font-size: 11px; }
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div id="app">

  <!-- Hero -->
  <div class="hero">
    <div class="logo-wrap">
      <img src="logo.png" alt="" id="logo-img"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'">
      <span id="logo-fallback">SVP</span>
    </div>
    <div class="server-name" id="srv-name">Simple Visual PVP</div>
    <div class="server-tag">FPS · Multi-Modes · Skin Armes</div>
    <div class="hero-meta">
      <div class="status-line">● ONLINE</div>
      <div class="pill" id="pill-players">
        <span class="live-dot"></span><span id="players-val">— / —</span>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="prog-block">
    <div class="prog-row">
      <span class="prog-label">LOADING</span>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="prog-foot">
      <div class="prog-status" id="prog-status">En attente de connexion...</div>
      <a class="discord-btn" href="https://discord.gg/hW76T774DZ" target="_blank">
        <svg class="d-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        discord.gg/sv
      </a>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="lb-wrap">
    <div class="lb-sep"></div>
    <div class="lb-grid">
      <div class="lb-col" id="lb-kills-col">
        <div class="lb-head">// top kills</div>
        <div id="lb-kills"></div>
      </div>
      <div class="lb-col" id="lb-kd-col">
        <div class="lb-head">// top k/d</div>
        <div id="lb-kd"></div>
      </div>
      <div class="lb-col" id="lb-wins-col">
        <div class="lb-head">// top victoires</div>
        <div id="lb-wins"></div>
      </div>
    </div>
  </div>

</div>

<script>
var BIN_ID = "6a26c65fda38895dfe9a17ee";

// ── GMod callbacks ─────────────────────────────
window.GameDetails = function(servername, serverurl, mapname, maxplayers) {
  if (servername && servername.trim())
    document.getElementById("srv-name").textContent = servername;
  if (maxplayers) {
    document.getElementById("players-val").textContent = "— / " + maxplayers;
    document.getElementById("pill-players").classList.add("show");
  }
};
window.SetStatusChanged = function(status) {
  if (status) document.getElementById("prog-status").textContent = status;
};

// ── Particules flottantes ──────────────────────
(function() {
  var cv  = document.getElementById("canvas-bg");
  var ctx = cv.getContext("2d");
  var W, H, pts;
  var COUNT = 80;
  var MAX_DIST = 140;

  function mkPt() {
    return {
      x:  Math.random() * W,
      y:  Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r:  1 + Math.random() * 1.5,
      a:  0.2 + Math.random() * 0.5
    };
  }

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    pts = [];
    for (var i = 0; i < COUNT; i++) pts.push(mkPt());
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(167,139,245," + p.a + ")";
      ctx.fill();
    }

    for (var i = 0; i < pts.length; i++) {
      for (var j = i + 1; j < pts.length; j++) {
        var dx = pts[i].x - pts[j].x;
        var dy = pts[i].y - pts[j].y;
        var d  = Math.sqrt(dx * dx + dy * dy);
        if (d < MAX_DIST) {
          var alpha = (1 - d / MAX_DIST) * 0.18;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = "rgba(115,64,232," + alpha + ")";
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  resize(); draw();
})();

// ── Progress ───────────────────────────────────
var curPct = 0;
function setProgress(pct) {
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-pct").textContent = Math.round(pct) + "%";
}
function animPct(target, ms) {
  var from = curPct, start = null;
  function step(ts) {
    if (!start) start = ts;
    var t = Math.min((ts - start) / ms, 1);
    var e = 1 - Math.pow(1 - t, 3);
    curPct = from + (target - from) * e;
    setProgress(curPct);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
setProgress(0);
setTimeout(function() { animPct(18,  700); }, 100);
setTimeout(function() { animPct(52, 1800); }, 900);
setTimeout(function() { animPct(78, 2500); }, 3000);
setTimeout(function() { animPct(92, 3500); }, 6000);

// ── Leaderboard ────────────────────────────────
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

var RKC = ["r1","","","",""];

// couleurs de fallback pour les initiales
var AVATAR_COLORS = [
  "rgba(115,64,232,.6)","rgba(167,139,245,.6)","rgba(80,120,220,.6)",
  "rgba(200,80,160,.6)","rgba(60,180,180,.6)"
];

function makeAvatarEl(entry, idx) {
  var wrap = document.createElement("div");
  wrap.className = "lb-avatar";

  if (entry.avatar) {
    var img = document.createElement("img");
    img.src = entry.avatar;
    img.alt = "";
    var init = document.createElement("span");
    init.className = "lb-avatar-init";
    init.textContent = (entry.name || "?")[0].toUpperCase();
    img.addEventListener("error", function() {
      img.style.display = "none";
      init.style.display = "block";
      wrap.style.background = AVATAR_COLORS[idx % AVATAR_COLORS.length];
    });
    wrap.appendChild(img);
    wrap.appendChild(init);
  } else {
    var init2 = document.createElement("span");
    init2.className = "lb-avatar-init";
    init2.textContent = (entry.name || "?")[0].toUpperCase();
    init2.style.display = "block";
    wrap.style.background = AVATAR_COLORS[idx % AVATAR_COLORS.length];
    wrap.appendChild(init2);
  }
  return wrap;
}

function renderCol(id, data, key, fmt) {
  var el = document.getElementById(id);
  if (!el || !data || !data.length) return;
  el.innerHTML = "";
  data.slice(0, 5).forEach(function(entry, i) {
    var v = fmt ? fmt(entry[key]) : entry[key];
    var row = document.createElement("div");
    row.className = "lb-row";

    var rank = document.createElement("span");
    rank.className = "lb-rank " + (RKC[i] || "");
    rank.textContent = "#" + (i + 1);

    var avatar = makeAvatarEl(entry, i);

    var name = document.createElement("span");
    name.className = "lb-name";
    name.textContent = String(entry.name || "?").substring(0, 18);

    var val = document.createElement("span");
    val.className = "lb-val";
    val.textContent = v;

    row.appendChild(rank);
    row.appendChild(avatar);
    row.appendChild(name);
    row.appendChild(val);
    el.appendChild(row);
  });
}

function fmt2(n) { return (parseFloat(n) || 0).toFixed(2); }

function renderAll(lb) {
  renderCol("lb-kills", lb.kills, "kills", null);
  renderCol("lb-kd",    lb.kd,    "kd",    fmt2);
  renderCol("lb-wins",  lb.wins,  "wins",  null);
  setTimeout(function() {
    document.getElementById("lb-kills-col").classList.add("show");
    setTimeout(function() { document.getElementById("lb-kd-col").classList.add("show"); }, 120);
    setTimeout(function() { document.getElementById("lb-wins-col").classList.add("show"); }, 240);
  }, 800);
}

// ── Données démo (avec avatars optionnels) ─────
// Format jsonbin attendu :
// { "kills": [{"name":"...", "kills":412, "avatar":"https://avatars.steamstatic.com/HASH_medium.jpg"}, ...], ... }
var DEMO = {
  kills: [
    {name:"raph_",   kills:412},
    {name:"Nova",    kills:301},
    {name:"Frosty",  kills:241},
    {name:"Saitama", kills:198},
    {name:"xGhost",  kills:176}
  ],
  kd: [
    {name:"Nova",    kd:4.82},
    {name:"raph_",   kd:3.71},
    {name:"Frosty",  kd:3.40},
    {name:"Saitama", kd:2.95},
    {name:"xGhost",  kd:2.61}
  ],
  wins: [
    {name:"raph_",   wins:98},
    {name:"Nova",    wins:87},
    {name:"Frosty",  wins:71},
    {name:"Saitama", wins:54},
    {name:"xGhost",  wins:49}
  ],
};

if (BIN_ID === "6a26c65fda38895dfe9a17ee") {
  renderAll(DEMO);
} else {
  fetch("https://api.jsonbin.io/v3/b/" + BIN_ID + "/latest", {
    headers:{"X-JSON-Privacy":"false"}
  })
  .then(function(r) { return r.json(); })
  .then(function(d) { renderAll(d.record || d); })
  .catch(function() { renderAll(DEMO); });
}
</script>
</body>
</html>
